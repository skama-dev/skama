name: Bug report
description: Report something in Skama that does not work as expected.
labels: ["bug"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not use this form for security vulnerabilities. Report them privately as described in the [security policy](https://github.com/skama-dev/skama/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest component or command that shows the problem, and the steps to trigger it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen instead.
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - skama (Python)
        - "@skama/runtime (npm)"
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skama version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version and browser, if relevant.
      placeholder: macOS 15, Python 3.13, Firefox 145
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Error messages, compiler output or browser console logs. This is rendered as code automatically.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have searched the existing issues and this bug has not been reported yet.
          required: true
        - label: I agree to follow this project's code of conduct.
          required: true
